version: 0.0
os: linux

files:
  - source: target/employee-management-api.jar
    destination: /opt/employee-management-api/

hooks:
  BeforeInstall:
    - location: scripts/stop_application.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/set_permissions.sh
      timeout: 60
      runas: root

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root
